[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lwiki"
version = "2.0.0"
description = "CLI for the OKF 0.2 native llm-wiki bundle: init, raw drift tracking, conformance validation, web UI server, legacy-wiki migration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
lwiki = "lwiki.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["lwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
